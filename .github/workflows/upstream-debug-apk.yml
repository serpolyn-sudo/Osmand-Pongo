name: OsmAnd upstream - Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upstream-debug-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout OsmAnd source
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd
          path: android
          submodules: recursive

      - name: Checkout OsmAnd resources
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-resources
          path: resources

      - name: Checkout OsmAnd core
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-core
          path: core

      - name: Checkout OsmAnd core legacy
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-core-legacy
          path: core-legacy

      - name: Checkout OsmAnd build
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-build
          path: build

      - name: Checkout OsmAnd tools
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-tools
          path: tools

      - name: Checkout OsmAnd misc
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-misc
          path: misc

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Print Gradle version
        working-directory: android
        run: ./gradlew --version

      - name: Assemble OsmAnd debug APK
        working-directory: android
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'
        run: ./gradlew :OsmAnd:assembleNightlyFreeLegacyFatDebug --stacktrace --no-daemon

      - name: Upload APK if generated
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OsmAnd-upstream-debug-apk
          path: android/OsmAnd/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14
