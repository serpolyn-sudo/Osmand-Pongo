name: OsmAnd Pongo - Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  android-debug:
    name: Build OsmAnd debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout our OsmAnd Pongo sources
        uses: actions/checkout@v4
        with:
          path: android

      - name: Checkout OsmAnd resources
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-resources
          path: resources

      - name: Checkout OsmAnd core
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-core
          path: core

      - name: Checkout OsmAnd core legacy
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-core-legacy
          path: core-legacy

      - name: Checkout OsmAnd build
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-build
          path: build

      - name: Checkout OsmAnd tools
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-tools
          path: tools

      - name: Checkout OsmAnd misc
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-misc
          path: misc

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Permit Gradle wrapper
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK using upstream-supported flavor
        working-directory: android
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'
        run: ./gradlew :OsmAnd:assembleNightlyFreeLegacyFatDebug --stacktrace --no-daemon

      - name: Upload APK (if generated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OsmAnd-Pongo-debug-apk
          path: android/OsmAnd/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Gradle reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: |
            android/**/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
