name: OsmAnd GPSRadar - clean upstream integration APK

on:
  workflow_dispatch:
  push:
    branches: [feature/osmand-gpsradar-clean]
    paths:
      - '.github/workflows/gpsradar-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout GPSRadar patches (no Pongo)
        uses: actions/checkout@v4
        with:
          path: gpsradar_repo
      - name: Checkout original OsmAnd
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd
          path: android
          submodules: recursive
      - name: Checkout OsmAnd resources
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-resources
          path: resources
      - name: Checkout OsmAnd core
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-core
          path: core
      - name: Checkout OsmAnd core legacy
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-core-legacy
          path: core-legacy
      - name: Checkout OsmAnd build
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-build
          path: build
      - name: Checkout OsmAnd tools
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-tools
          path: tools
      - name: Checkout OsmAnd misc
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-misc
          path: misc
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          ls "${ANDROID_SDK_ROOT}/build-tools"
      - name: Apply distinct clean GPSRadar application identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          build=Path("android/OsmAnd/build.gradle")
          s=build.read_text()
          old='applicationId "net.osmand.dev"'
          assert s.count(old)==1, "Original OsmAnd Nightly ID not found"
          s=s.replace(old,'applicationId "com.osmand.gpsradar"',1)
          oldName='resValue "string", "app_name", "OsmAnd Nightly"'
          assert s.count(oldName)==1
          s=s.replace(oldName,'resValue "string", "app_name", "OsmAnd GPSRadar"',1)
          # Keep OpenGL but package only native libraries used by modern ARM64 phones.
          # Fat debug APK otherwise includes multiple ABIs and becomes needlessly huge.
          abi_line='''\n        ndk {\n            abiFilters "arm64-v8a"\n        }'''
          default_block='defaultConfig {'
          assert build.read_text().count(default_block)==1
          s=s.replace(default_block,default_block+abi_line,1)
          build.write_text(s)
          manifest=Path("android/OsmAnd/AndroidManifest-nightlyFree.xml")
          xml=manifest.read_text()
          oldAuthority='android:authorities="net.osmand.dev.fileprovider"'
          assert xml.count(oldAuthority)==1
          manifest.write_text(xml.replace(oldAuthority,
                 'android:authorities="com.osmand.gpsradar.fileprovider"',1))
          PY
      - name: Integrate native GPSRadar classes, widget and download UI
        shell: bash
        run: |
          set -euo pipefail
          test ! -d gpsradar_repo/overlays
          test -f gpsradar_repo/gpsradar/android/net/osmand/plus/gpsradar/GpsRadarEngine.java
          test -s gpsradar_repo/gpsradar/overlays/OsmAnd/assets/gpsradar_icons/atlas24.png
          test -f gpsradar_repo/gpsradar/overlays/OsmAnd/src/net/osmand/plus/settings/fragments/ScreenAlertsFragment.java
          test -f gpsradar_repo/gpsradar/overlays/OsmAnd/res/xml/screen_alerts.xml
          cp -a gpsradar_repo/gpsradar/android/. android/OsmAnd/src/
          cp -a gpsradar_repo/gpsradar/overlays/OsmAnd/. android/OsmAnd/
          python3 - <<'PY'
          from pathlib import Path
          widget=Path("android/OsmAnd/src/net/osmand/plus/views/mapwidgets/WidgetType.java").read_text()
          assert 'GPSRADAR_ALERT(' in widget
          assert 'GpsRadarAlertWidget' in Path(
              "android/OsmAnd/src/net/osmand/plus/views/mapwidgets/MapWidgetsFactory.java").read_text()
          assert 'new GpsRadarMapLayer(app)' in Path(
              "android/OsmAnd/src/net/osmand/plus/views/MapLayers.java").read_text()
          assert 'gpsradar_settings' in Path(
              "android/OsmAnd/res/xml/screen_alerts.xml").read_text()
          assert Path("android/OsmAnd/assets/gpsradar_icons/atlas24.png").stat().st_size > 1000
          print("GPSRadar native hooks, original 32-icon atlas and profile settings installed")
          print("Clean GPSRadar source commit: ${GITHUB_SHA:-unknown}")
          PY
      - name: Build ARM64 OpenGL GPSRadar APK
        working-directory: android
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'
        run: |
          chmod +x gradlew
          ./gradlew :OsmAnd:assembleNightlyFreeOpenglFatDebug --stacktrace --no-daemon --console=plain
      - name: Produce compact ARM64 APK and sign with debug key
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, zipfile
          apks=glob.glob('android/OsmAnd/build/outputs/apk/**/*.apk', recursive=True)
          assert len(apks)==1, f'Expected one APK, got {apks}'
          apk=apks[0]
          filtered=apk+'.filtered'
          removed=0
          with zipfile.ZipFile(apk, 'r') as source, zipfile.ZipFile(filtered, 'w', allowZip64=True) as dest:
              for info in source.infolist():
                  parts=info.filename.split('/')
                  if len(parts)>2 and parts[0]=='lib' and parts[1] in ('armeabi-v7a','x86','x86_64'):
                      removed+=1
                      continue
                  # v1/v2 signatures must be regenerated. Keep all other entries.
                  if info.filename.startswith('META-INF/') and (info.filename.endswith(('.RSA','.SF','.DSA'))):
                      continue
                  dest.writestr(info, source.read(info.filename))
          os.replace(filtered, apk)
          print(f'Filtered {removed} non-ARM64 native libraries')
          print(f'Removed {removed} non-ARM64 libraries')
          PY
          BUILD_TOOLS="${ANDROID_SDK_ROOT}/build-tools/$(ls "${ANDROID_SDK_ROOT}/build-tools" | sort -V | tail -1)"
          APK=$(find android/OsmAnd/build/outputs/apk -type f -name '*.apk' | head -1)
          "${BUILD_TOOLS}/zipalign" -f -p 4 "$APK" "${APK}.aligned"
          mv "${APK}.aligned" "$APK"
          if [ ! -f android/keystores/debug.keystore ]; then
            mkdir -p android/keystores
            keytool -genkeypair -keystore android/keystores/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi
          "${BUILD_TOOLS}/apksigner" sign --ks android/keystores/debug.keystore \
            --ks-key-alias androiddebugkey --ks-pass pass:android \
            --key-pass pass:android --out "${APK}.signed" "$APK"
          mv "${APK}.signed" "$APK"
          "${BUILD_TOOLS}/apksigner" verify --verbose "$APK"
          "${BUILD_TOOLS}/zipalign" -c -p 4 "$APK"
      - name: Inspect native libraries and APK size
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, zipfile, os
          apks=glob.glob('android/OsmAnd/build/outputs/apk/**/*.apk',recursive=True)
          assert apks, 'APK not found'
          for apk in apks:
              with zipfile.ZipFile(apk) as z:
                  abis=sorted({n.split('/')[1] for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')})
              print(apk, 'size_MB=',round(os.path.getsize(apk)/1048576,1), 'ABIs=',abis)
              assert not (set(abis)-{'arm64-v8a'}), 'Unexpected native ABIs packaged'
          PY
      - name: Inspect APK identity
        shell: bash
        run: |
          APK=$(find android/OsmAnd/build/outputs/apk -type f -name '*.apk' | head -1)
          test -n "$APK"
          AAPT="${ANDROID_SDK_ROOT}/build-tools/$(ls "${ANDROID_SDK_ROOT}/build-tools" | sort -V | tail -1)/aapt"
          "$AAPT" dump badging "$APK" | grep -m1 "package: name='com.osmand.gpsradar'"
      - name: Save built APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OsmAnd-GPSRadar-arm64-opengl-debug-apk
          path: android/OsmAnd/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14
