name: OsmAnd-Pongo - separate debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pongo-separate-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout OsmAnd source
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd
          path: android
          submodules: recursive

      - name: Checkout OsmAnd resources
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-resources
          path: resources

      - name: Checkout OsmAnd core
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-core
          path: core

      - name: Checkout OsmAnd core legacy
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-core-legacy
          path: core-legacy

      - name: Checkout OsmAnd build
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-build
          path: build

      - name: Checkout OsmAnd tools
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-tools
          path: tools

      - name: Checkout OsmAnd misc
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-misc
          path: misc

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Use GitHub runner Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "Android SDK: ${ANDROID_SDK_ROOT}"
          ls -la "${ANDROID_SDK_ROOT}/cmdline-tools" || true
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Print Gradle version
        working-directory: android
        run: ./gradlew --version

      - name: Apply Pongo identity without modifying upstream source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          build = Path("android/OsmAnd/build.gradle")
          content = build.read_text()
          original_id = 'applicationId "net.osmand.dev"'
          original_name = 'resValue "string", "app_name", "OsmAnd Nightly"'
          assert content.count(original_id) == 1, "Unexpected nightlyFree applicationId; refusing unsafe patch"
          assert content.count(original_name) == 1, "Unexpected nightlyFree app name; refusing unsafe patch"
          content = content.replace(original_id, 'applicationId "com.osmand.pongo"', 1)
          content = content.replace(original_name, 'resValue "string", "app_name", "OsmAnd-Pongo"', 1)
          build.write_text(content)
          print("Pongo package and display name patched for nightlyFree flavor")
          PY
          grep -A6 'nightlyFree {' android/OsmAnd/build.gradle | tail -n 6

      - name: Assemble OsmAnd debug APK
        working-directory: android
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'
        run: ./gradlew :OsmAnd:assembleNightlyFreeLegacyFatDebug --stacktrace --no-daemon

      - name: Upload APK if generated
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OsmAnd-Pongo-separate-debug-apk
          path: android/OsmAnd/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
