name: OsmAnd-Pongo - separate debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, feature/portrait-pongo-hud]
    paths:
      - '.github/workflows/pongo-separate-apk.yml'
      - 'overlays/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Pongo overlays and build configuration
        uses: actions/checkout@v4
        with:
          path: pongo

      - name: Checkout OsmAnd source
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd
          path: android
          submodules: recursive

      - name: Checkout OsmAnd resources
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-resources
          path: resources

      - name: Checkout OsmAnd core
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-core
          path: core

      - name: Checkout OsmAnd core legacy
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-core-legacy
          path: core-legacy

      - name: Checkout OsmAnd build
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-build
          path: build

      - name: Checkout OsmAnd tools
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-tools
          path: tools

      - name: Checkout OsmAnd misc
        uses: actions/checkout@v4
        with:
          repository: osmandapp/OsmAnd-misc
          path: misc

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Use GitHub runner Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "Android SDK: ${ANDROID_SDK_ROOT}"
          ls -la "${ANDROID_SDK_ROOT}/cmdline-tools" || true
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Print Gradle version
        working-directory: android
        run: ./gradlew --version

      - name: Apply Pongo identity without modifying upstream source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          build = Path("android/OsmAnd/build.gradle")
          content = build.read_text()
          original_id = 'applicationId "net.osmand.dev"'
          original_name = 'resValue "string", "app_name", "OsmAnd Nightly"'
          assert content.count(original_id) == 1, "Unexpected nightlyFree applicationId; refusing unsafe patch"
          assert content.count(original_name) == 1, "Unexpected nightlyFree app name; refusing unsafe patch"
          content = content.replace(original_id, 'applicationId "com.osmand.pongo"', 1)
          content = content.replace(original_name, 'resValue "string", "app_name", "OsmAnd-Pongo"', 1)
          build.write_text(content)

          # The nightly flavor hard-codes the FileProvider authority to net.osmand.dev.
          # Android requires provider authorities to be globally unique across installed apps.
          manifest = Path("android/OsmAnd/AndroidManifest-nightlyFree.xml")
          xml = manifest.read_text()
          old_authority = 'android:authorities="net.osmand.dev.fileprovider"'
          assert xml.count(old_authority) == 1, "Unexpected nightly FileProvider authority; refusing unsafe patch"
          xml = xml.replace(old_authority, 'android:authorities="com.osmand.pongo.fileprovider"', 1)
          manifest.write_text(xml)
          print("Pongo nightly FileProvider authority patched")

          # The temporary PONGO NAV badge was removed. Preserve native map widgets
          # until route-aware Pongo HUD controls are implemented and tested.
          print("Pongo badge removed; native map layout preserved")
          # First substantial HUD layout pass: retain live OsmAnd speed and
          # limit widgets rather than inserting hardcoded navigation values.
          speedometer = Path("android/OsmAnd/res/layout/speedometer_widget.xml")
          speed_xml = speedometer.read_text()
          assert speed_xml.count('android:layout_width="88dp"') == 1
          assert speed_xml.count('android:layout_height="96dp"') == 1
          assert speed_xml.count('android:layout_width="72dp"') == 1
          assert speed_xml.count('android:layout_height="72dp"') >= 1
          speed_xml = speed_xml.replace('android:layout_width="88dp"', 'android:layout_width="102dp"', 1)
          speed_xml = speed_xml.replace('android:layout_height="96dp"', 'android:layout_height="90dp"', 1)
          speed_xml = speed_xml.replace('android:layout_width="72dp"', 'android:layout_width="78dp"', 1)
          speed_xml = speed_xml.replace('android:layout_height="72dp"', 'android:layout_height="78dp"', 1)
          speedometer.write_text(speed_xml)

          # Reposition live left/right OsmAnd widget columns inward from edges.
          hud = Path("android/OsmAnd/res/layout/map_hud_top.xml")
          hud_xml = hud.read_text()
          assert hud_xml.count('android:id="@+id/map_left_widgets_panel"') == 1
          assert hud_xml.count('android:id="@+id/map_right_widgets_panel"') == 1
          for side, margin in (('map_left_widgets_panel', '12dp'), ('map_right_widgets_panel', '12dp')):
              marker = 'android:id="@+id/' + side + '"'
              pos = hud_xml.index(marker)
              gravity = 'android:layout_gravity="top|start"' if side.startswith('map_left') else 'android:layout_gravity="top|end"'
              gpos = hud_xml.index(gravity, pos)
              assert gpos >= pos
              extra = 'android:layout_marginStart="' + margin + '"' if side.startswith('map_left') else 'android:layout_marginEnd="' + margin + '"'
              hud_xml = hud_xml[:gpos] + extra + ' ' + hud_xml[gpos:]
          hud.write_text(hud_xml)
          print("Pongo HUD: enlarged speed and speed-limit views, inset side widget columns")
          PY
          grep -A6 'nightlyFree {' android/OsmAnd/build.gradle | tail -n 6

      - name: Overlay Pongo HUD and replace native map buttons in both orientations
        shell: bash
        run: |
          # Uses separate Android layout-port resources: landscape resources remain unchanged.
          test -f pongo/overlays/res/layout-port/speedometer_widget.xml
          test -f pongo/overlays/res/layout-port/map_hud_top.xml
          test -f pongo/overlays/res/layout-port/map_hud_bottom.xml
          test -f pongo/overlays/res/layout-port/map_hud_layout.xml
          test -f pongo/overlays/java/net/osmand/plus/views/controls/PongoRouteBar.java
          test -f pongo/overlays/java/net/osmand/plus/views/controls/PongoTopHud.java
          test -f pongo/overlays/java/net/osmand/plus/views/layers/MapControlsLayer.java
          test -f pongo/overlays/res/drawable/pongo_speedometer_panel.xml
          test -f pongo/overlays/res/drawable/pongo_speed_limit_circle.xml
          for name in map_hud_layout.xml map_hud_top.xml map_hud_bottom.xml speedometer_widget.xml; do
            test -f "pongo/overlays/res/layout-land/$name"
          done
          mkdir -p android/OsmAnd/res/layout-port android/OsmAnd/res/layout-land android/OsmAnd/res/drawable android/OsmAnd/src/net/osmand/plus/views/controls android/OsmAnd/src/net/osmand/plus/views/layers
          cp pongo/overlays/res/layout-port/speedometer_widget.xml android/OsmAnd/res/layout-port/speedometer_widget.xml
          cp pongo/overlays/res/layout-port/map_hud_top.xml android/OsmAnd/res/layout-port/map_hud_top.xml
          cp pongo/overlays/res/layout-port/map_hud_bottom.xml android/OsmAnd/res/layout-port/map_hud_bottom.xml
          cp pongo/overlays/res/layout-port/map_hud_layout.xml android/OsmAnd/res/layout-port/map_hud_layout.xml
          for name in map_hud_layout.xml map_hud_top.xml map_hud_bottom.xml speedometer_widget.xml; do
            cp "pongo/overlays/res/layout-land/$name" "android/OsmAnd/res/layout-land/$name"
          done
          cp pongo/overlays/java/net/osmand/plus/views/controls/PongoRouteBar.java android/OsmAnd/src/net/osmand/plus/views/controls/PongoRouteBar.java
          cp pongo/overlays/java/net/osmand/plus/views/controls/PongoTopHud.java android/OsmAnd/src/net/osmand/plus/views/controls/PongoTopHud.java
          cp pongo/overlays/java/net/osmand/plus/views/layers/MapControlsLayer.java android/OsmAnd/src/net/osmand/plus/views/layers/MapControlsLayer.java
          cp pongo/overlays/res/drawable/pongo_speedometer_panel.xml android/OsmAnd/res/drawable/pongo_speedometer_panel.xml
          cp pongo/overlays/res/drawable/pongo_speed_limit_circle.xml android/OsmAnd/res/drawable/pongo_speed_limit_circle.xml
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          for name in ('speedometer_widget.xml', 'map_hud_top.xml', 'map_hud_bottom.xml', 'map_hud_layout.xml'):
              portrait = Path('android/OsmAnd/res/layout-port') / name
              ET.parse(portrait)
          for name in ('speedometer_widget.xml', 'map_hud_top.xml', 'map_hud_bottom.xml', 'map_hud_layout.xml'):
              ET.parse(Path('android/OsmAnd/res/layout-land') / name)
          ET.parse('android/OsmAnd/res/drawable/pongo_speedometer_panel.xml')
          ET.parse('android/OsmAnd/res/drawable/pongo_speed_limit_circle.xml')
          speed = Path('android/OsmAnd/res/layout-port/speedometer_widget.xml').read_text()
          assert speed.index('id="@+id/speed_limit_container"') < speed.index('id="@+id/speedometer_container"')
          hud = Path('android/OsmAnd/res/layout-port/map_hud_layout.xml').read_text()
          assert 'net.osmand.plus.views.controls.PongoRouteBar' in hud
          assert 'net.osmand.plus.views.controls.PongoTopHud' in hud
          print('Both portrait and landscape Pongo overrides installed and XML parsed')
          PY

      - name: Assemble OsmAnd debug APK
        working-directory: android
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'
        run: ./gradlew :OsmAnd:assembleNightlyFreeLegacyFatDebug --stacktrace --no-daemon

      - name: Check APK identity and provider authorities
        shell: bash
        run: |
          APK=$(find android/OsmAnd/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "APK: $APK"
          AAPT="${ANDROID_SDK_ROOT}/build-tools/$(ls "${ANDROID_SDK_ROOT}/build-tools" | sort -V | tail -n 1)/aapt"
          "$AAPT" dump badging "$APK" | grep -m1 "^package:"
          "$AAPT" dump badging "$APK" | grep -m1 "^application-label:"
          PACKAGE=$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)
          test "$PACKAGE" = "com.osmand.pongo"

      - name: Upload APK if generated
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OsmAnd-Pongo-separate-debug-apk
          path: android/OsmAnd/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
